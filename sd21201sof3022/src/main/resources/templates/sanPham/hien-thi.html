<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    Tim kiem san pham:
    <form action="/san-pham/find" method="get">
        ten: <input type="text" name="ten"> <br>
        <button>Search</button>
    </form>
    <br>
    Them san pham:
    <form th:object="${sanPham}" action="/san-pham/them" method="post">
        ten: <input type="text" th:field="*{ten}"> <i th:errors="*{ten}"></i> <br>
        gia: <input type="text" th:field="*{gia}"> <i  th:errors="*{gia}"></i> <br>
        tinh trang: <i th:errors="*{tinhTrang}"></i> <br>
        con <input type="radio" th:field="*{tinhTrang}" value="true">
        het <input type="radio" th:field="*{tinhTrang}" value="false">
        <br>
        danh muc: <i th:errors="*{danhMuc}"></i> <br>
            <select th:field="*{danhMuc}">
                <option selected value="">Vui long chon</option>
                <th:block th:each="danhMuc : ${listDanhMuc}">
                    <option th:text="${danhMuc.ten}" th:value="${danhMuc.id}"></option>
                </th:block>
            </select>
        <br>
        <button>Save</button>
    </form>
    <br>
    Bang san pham:
    <table>
        <thead>
        <tr>
            <th>Id</th>
            <th>Ten</th>
            <th>gia</th>
            <th>Tinh trang</th>
            <th>Danh muc</th>
            <th>Hanh dong</th>
        </tr>
        </thead>
        <tbody>
        <th:block th:each="sanPham : ${listSanPham}">
            <tr>
                <td th:text="${sanPham.id}"></td>
                <td th:text="${sanPham.ten}"></td>
                <td th:text="${sanPham.gia}"></td>
                <td th:text="${sanPham.tinhTrang == true ? 'Con' : 'Het'}"></td>
                <td th:text="${sanPham.danhMuc.ten}"></td>
                <td>
                    <a th:href="@{|/san-pham/view-update/${sanPham.id}|}">View update</a>
                    <a th:href="@{|/san-pham/xoa?id=${sanPham.id}|}">Xoa</a>
                </td>
            </tr>
        </th:block>
        </tbody>
    </table>
</body>
</html>
